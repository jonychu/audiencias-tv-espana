name: Scrape diario de audiencias

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar el scraper (día de ayer)
        run: python scraper_audiencias.py

      - name: Publicar los datos nuevos
        run: |
          git config user.name "audiencias-bot"
          git config user.email "audiencias-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Datos de audiencias: $(date +'%Y-%m-%d')"
          git push

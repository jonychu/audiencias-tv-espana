<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audiencias TV España</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E1117;
    --surface: #161B24;
    --surface-2: #1E2430;
    --border: #2A3040;
    --text: #E7E9EE;
    --text-muted: #8891A3;
    --accent: #2FD3B0;
    --accent-dim: #1B7A66;
    --live: #E24B4A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 32px 20px 64px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }

  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 26px; margin: 0; display: flex; align-items: center; gap: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--live); display: inline-block; }
  @media (prefers-reduced-motion: no-preference) {
    .dot { animation: pulse 2s ease-in-out infinite; }
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .updated { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-muted); }

  section { margin-bottom: 40px; }
  h2 { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 14px; }

  .top5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card .rank { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-muted); }
  .card .name { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; margin: 6px 0 8px; }
  .card .share { font-family: 'IBM Plex Mono', monospace; font-size: 24px; color: var(--accent); }

  .bar-row { display: grid; grid-template-columns: 110px 1fr 56px; align-items: center; gap: 12px; padding: 7px 0; }
  .bar-row .label { font-size: 13px; color: var(--text); }
  .bar-track { background: var(--surface-2); border-radius: 4px; height: 8px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .bar-row .value { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-muted); text-align: right; }

  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }

  .empty { background: var(--surface); border: 1px dashed var(--border); border-radius: 10px; padding: 28px; text-align: center; color: var(--text-muted); font-size: 14px; }

  footer { color: var(--text-muted); font-size: 12px; line-height: 1.6; border-top: 1px solid var(--border); padding-top: 16px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot" aria-hidden="true"></span> Audiencias TV España</h1>
    <span class="updated" id="updated">cargando…</span>
  </header>

  <section>
    <h2>Top 5 canales (último día)</h2>
    <div class="top5" id="top5"></div>
  </section>

  <section>
    <h2>Cuota de pantalla, todas las cadenas</h2>
    <div id="bars"></div>
  </section>

  <section>
    <h2>Evolución, últimos días</h2>
    <div class="chart-card">
      <canvas id="evolChart" height="220"></canvas>
    </div>
  </section>

  <footer>
    Datos agregados a partir de las publicaciones diarias de audiencias de FormulaTV.
    No es medición en directo: refleja la jornada anterior, actualizada cada mañana.
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
async function loadData() {
  try {
    const res = await fetch('./data/history.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('no data yet');
    const days = await res.json();
    if (!days.length) throw new Error('empty');
    render(days);
  } catch (e) {
    document.getElementById('top5').innerHTML =
      '<div class="empty">Aún no hay datos. El primer scrape se ejecuta en la próxima pasada programada, o lánzalo a mano desde la pestaña "Actions" de GitHub.</div>';
    document.getElementById('updated').textContent = '';
  }
}

function render(days) {
  const last = days[days.length - 1];
  document.getElementById('updated').textContent = 'actualizado: ' + last.fecha;

  const sorted = [...last.canales].sort((a, b) => b.cuota - a.cuota);

  const top5 = document.getElementById('top5');
  top5.innerHTML = sorted.slice(0, 5).map((c, i) => `
    <div class="card">
      <div class="rank">#${i + 1}</div>
      <div class="name">${c.cadena}</div>
      <div class="share">${c.cuota.toFixed(1)}%</div>
    </div>
  `).join('');

  const maxShare = sorted[0]?.cuota || 1;
  const bars = document.getElementById('bars');
  bars.innerHTML = sorted.map(c => `
    <div class="bar-row">
      <div class="label">${c.cadena}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(c.cuota / maxShare * 100).toFixed(1)}%"></div></div>
      <div class="value">${c.cuota.toFixed(1)}%</div>
    </div>
  `).join('');

  const topNames = sorted.slice(0, 5).map(c => c.cadena);
  const labels = days.map(d => d.fecha.slice(5));
  const palette = ['#2FD3B0', '#F2A93B', '#7F77DD', '#D4537E', '#378ADD'];
  const datasets = topNames.map((name, i) => ({
    label: name,
    data: days.map(d => (d.canales.find(c => c.cadena === name) || {}).cuota ?? null),
    borderColor: palette[i % palette.length],
    backgroundColor: 'transparent',
    tension: 0.25,
    spanGaps: true,
  }));

  new Chart(document.getElementById('evolChart'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#E7E9EE', font: { family: 'Inter' } } } },
      scales: {
        x: { ticks: { color: '#8891A3' }, grid: { color: '#2A3040' } },
        y: { ticks: { color: '#8891A3', callback: v => v + '%' }, grid: { color: '#2A3040' } },
      },
    },
  });
}

loadData();
</script>
</body>
</html>
